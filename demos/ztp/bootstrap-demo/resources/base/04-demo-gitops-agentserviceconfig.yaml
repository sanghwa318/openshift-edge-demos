apiVersion: agent-install.openshift.io/v1beta1
kind: AgentServiceConfig
metadata:
 name: agent
 annotations:
   argocd.argoproj.io/sync-wave: "4"
   argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  databaseStorage:
    accessModes:
    - ReadWriteOnce
    resources:
      requests:
        storage: 10Gi
  filesystemStorage:
    accessModes:
    - ReadWriteOnce
    resources:
      requests:
        storage: 100Gi
  imageStorage:
    accessModes:
    - ReadWriteOnce
    resources:
      requests:
        storage: 50Gi
  osImages:
    - cpuArchitecture: x86_64
      openshiftVersion: "4.18.9"
      version: "4.18.0-okd-scos.9"
      rootFSUrl: http://192.168.3.49:8080/okd418/fedora-coreos-39.20231101.3.0-live-rootfs.x86_64.img
      url: http://192.168.3.49:8080/okd418/fedora-coreos-39.20231101.3.0-live.x86_64.iso
